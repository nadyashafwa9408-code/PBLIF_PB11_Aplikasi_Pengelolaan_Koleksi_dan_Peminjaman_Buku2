<!DOCTYPE html>
<html lang=id>
    <head>
        <meta charset=utf-8>
        <meta name=viewport content='width=device-width,initial-scale=1'>
        <title>Buku.in</title>
        <link rel=stylesheet href=style.css>
    </head>
    <body data-p=daftar data-r=auth>
        <div id=app></div>
        <script src=app.js></script>
        <script>
document.addEventListener("DOMContentLoaded", function () {
  // 1. Cari panel kiri. Ganti ".panel-kiri" dengan class panelmu kalau beda.
  var panel = document.querySelector(".panel-kiri");

  // Cadangan: cari lewat judul "Temukan cerita..."
  if (!panel) {
    var judul = Array.from(document.querySelectorAll("h1, h2"))
      .find(function (el) { return el.textContent.includes("Temukan cerita"); });
    if (judul) panel = judul.parentElement;
  }
  if (!panel) { console.warn("Panel kiri tidak ditemukan"); return; }

  // 2. Susun panel supaya isi bisa didorong ke bawah
  panel.style.display = "flex";
  panel.style.flexDirection = "column";

  // 3. Buat wadah gambar
  var wrap = document.createElement("div");
  wrap.style.marginTop = "auto";
  wrap.style.alignSelf = "center";
  wrap.style.width = "100%";
  wrap.style.maxWidth = "340px";

  wrap.innerHTML = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 270" style="width:100%;display:block" role="img" aria-label="Ilustrasi Buku.in">
      <circle cx="110" cy="105" r="55" fill="#FBE9A6"/>
      <rect x="160" y="25" width="165" height="185" rx="8" fill="#DAD7F7" stroke="#8C84DE" stroke-width="6"/>
      <rect x="180" y="150" width="16" height="50" rx="3" fill="#7A64CF"/>
      <rect x="205" y="130" width="16" height="70" rx="3" fill="#A592E6"/>
      <rect x="230" y="186" width="18" height="14" rx="3" fill="#F2907F"/>
      <rect x="255" y="70" width="16" height="130" rx="3" fill="#5656C8"/>
      <rect x="280" y="105" width="18" height="95" rx="3" fill="#E5B450"/>
      <rect x="150" y="205" width="190" height="10" rx="5" fill="#6F66D6"/>
      <path d="M62 205 C60 180 58 160 56 135" stroke="#6B63C9" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="62" cy="125" rx="30" ry="9" transform="rotate(-25 62 125)" fill="#6B63C9"/>
      <ellipse cx="38" cy="150" rx="27" ry="9" transform="rotate(35 38 150)" fill="#8E86DD"/>
      <ellipse cx="78" cy="168" rx="26" ry="8" transform="rotate(-55 78 168)" fill="#6B63C9"/>
      <polygon points="10,250 80,250 70,215 22,215" fill="#A59BE6"/>
      <g stroke="#7B72D8" stroke-width="5" stroke-linejoin="round" fill="#FFFFFF">
        <path d="M45 160 L128 150 L136 245 L52 255 Z"/>
        <path d="M136 245 L128 150 L212 162 L205 252 Z"/>
      </g>
      <path d="M128 150 L136 245" stroke="#7B72D8" stroke-width="5" stroke-linecap="round"/>
    </svg>`;

  // 4. Tempel di akhir panel
  panel.appendChild(wrap);
});
</script>

    </body>
</html>
